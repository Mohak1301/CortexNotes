# Local full-stack development. Prod uses the same backend/Dockerfile on Render.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Supplies OPENAI_API_KEY and the SUPABASE_* values from your existing file.
    env_file:
      - ./backend/.env
    environment:
      # Development skips assertProductionConfig, so cloud Qdrant vars are not required.
      NODE_ENV: development
      PORT: 5000
      # Overrides the cloud cluster in .env: local dev talks to the container above.
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION_NAME: cortex-notes-local
      FRONTEND_URL: http://localhost:3000
    # Restart on save. Node 20 has --watch built in, so no nodemon needed.
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./backend:/app
      # Keeps the image's node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
